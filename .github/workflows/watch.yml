name: nabit-watch

# Runs the watch executor every 10 minutes on GitHub's free (unlimited for
# public repos) Actions minutes. Reads watches from Supabase; dedupe is
# DB-backed (alerts unique index), so no state cache needed. Notifications
# stay in DRY-RUN until RESEND_API_KEY secret is set — no code change to go live.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: nabit-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run watch executor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: node worker/executor.mjs
