name: nabit-watch

# Runs the watch executor every 10 minutes on GitHub's free (unlimited for
# public repos) Actions minutes. Stays in DRY-RUN until the RESEND_API_KEY
# secret is set — no code change needed to go live.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: nabit-watch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Persist dedupe state (.state/) across scheduled runs. Unique key per
      # run + restore-keys prefix restores the most recent prior state.
      - name: Restore dedupe state
        uses: actions/cache@v4
        with:
          path: .state
          key: nabit-state-${{ github.run_id }}
          restore-keys: |
            nabit-state-

      - name: Run watch executor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
          ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
        run: node src/executor.mjs
